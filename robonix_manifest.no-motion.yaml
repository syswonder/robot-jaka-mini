# No-motion acceptance manifest: no motion-capable instances.
# Boot this first (start.sh robonix_manifest.no-motion.yaml), verify soma
# interfaces and TF, then run estop checks before adding jaka_arm back.
manifestVersion: 1
name: robonix-jaka-mini-no-motion

catalog:
  name: robonix.robot.jaka.mini
  version: 0.1.0
  description: No-motion acceptance manifest for the JAKA Mini deployment.
  license: Apache-2.0
  tags: [robot, deploy, arm, jaka]
  maintainers:
    - Felix <xi.lifeng@qq.com>

env:
  ROS_DOMAIN_ID: "0"
  RMW_IMPLEMENTATION: rmw_zenoh_cpp
  ROBONIX_ZENOH_MODE: client
  ROBONIX_ZENOH_ROUTER: tcp/127.0.0.1:7447
  # Host-side package code (robot_description provider) runs on `python3`;
  # its generated gRPC bindings require grpcio>=1.76, which only the
  # deployment venv has (system python3 pins grpcio 1.73 for JetPack).
  # Prepend the venv so ANY boot path (plain `rbnx boot` or start.sh) picks
  # the right interpreter.
  PATH: "/home/nvidia/robot-jaka-mini/.venv/bin:${PATH}"

system:
  atlas:
    listen: 0.0.0.0:50051
  soma:
    listen: 127.0.0.1:50091
    # Same ROS runtime reader wrapper as robonix_manifest.yaml: rclpy comes
    # from the /opt/ros/humble install, the msg modules from the codegen
    # workspace; source both explicitly so the reader does not depend on
    # the boot shell's environment.
    runtime_reader_command:
      - bash
      - -c
      - "source /opt/ros/humble/setup.bash && source /home/nvidia/primitive-jaka-rbnx/rbnx-build/codegen/ros2_idl/install/setup.bash && exec python3 -u {script} {config}"
  vitals:
    listen: 0.0.0.0:50093

primitive:
  - name: robot_description
    url: https://github.com/syswonder/primitive-robot-description-rbnx
    branch: main
    # Native mode — see robonix_manifest.yaml.
    manifest: package_manifest.native.yaml
